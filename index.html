<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nameless</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      color: #f7f1df;
      background: #111;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.35)),
        url("castle-bg.png") center center / cover no-repeat fixed;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .menu {
      text-align: center;
      padding: 2rem 3rem;
      border-radius: 18px;
      background: rgba(10, 12, 10, 0.48);
      backdrop-filter: blur(3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(3rem, 8vw, 7rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 4px 14px rgba(0,0,0,0.75);
    }

    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.55);
      background: rgba(20, 28, 20, 0.78);
      color: white;
      padding: 0.9rem 2.2rem;
      font: inherit;
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 8px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: rgba(45, 62, 45, 0.92);
    }

    #message {
      margin-top: 1rem;
      min-height: 1.5em;
      font-size: 1rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="menu">
    <h1>Nameless</h1>
    <button id="enterButton">ENTER</button>
    <div id="message"></div>
  </main>

  <script>
    const button = document.getElementById("enterButton");
    const message = document.getElementById("message");

    button.addEventListener("click", () => {
      message.textContent = "The road begins...";
    });
  </script>
</body>
</html>
