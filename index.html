<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nameless</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #f5ead4;
      background:
        linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.38)),
        url("forest-battle-bg.jpg") center / cover no-repeat;
      display: grid;
      place-items: center;
    }
    .menu {
      width: min(760px, 86vw);
      padding: 2.5rem 3rem;
      text-align: center;
      background: rgba(13, 14, 12, .68);
      border: 1px solid rgba(201, 166, 104, .55);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      backdrop-filter: blur(4px);
    }
    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(3rem, 6.5vw, 7rem);
      letter-spacing: .08em;
      text-shadow: 0 4px 15px #000;
    }
    a {
      display: inline-block;
      padding: .9rem 2.5rem;
      color: #f5ead4;
      text-decoration: none;
      border: 1px solid #b99b68;
      border-radius: 8px;
      background: rgba(20, 24, 20, .88);
      letter-spacing: .12em;
      font-size: 1.15rem;
    }
    a:hover { background: rgba(57, 55, 41, .95); }
  </style>
</head>
<body>
  <main class="menu">
    <h1>NAMELESS</h1>
    <a href="battle.html">ENTER</a>
  </main>
</body>
</html>
